version: '3.8'

services:
  # --------------------------------------------------------
  # 1. INFRAESTRUCTURA BASE (Broker, BD y MQTT)
  # --------------------------------------------------------
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: ecosystems_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_password
      POSTGRES_DB: ecosystems_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mapear el script SQL: Postgres lo ejecuta automáticamente al iniciar por primera vez
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecosystems_rabbitmq
    ports:
      - "5672:5672"   # Puerto de mensajería AMQP
      - "15672:15672" # Interfaz web de RabbitMQ

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ecosystems_mqtt
    ports:
      - "1883:1883"
    # Comando rápido para permitir conexiones locales sin contraseña en dev
    command: sh -c "echo 'listener 1883\nallow_anonymous true' > /mosquitto/config/mosquitto.conf && mosquitto -c /mosquitto/config/mosquitto.conf"

  # --------------------------------------------------------
  # 2. MICROSERVICIOS PYTHON
  # --------------------------------------------------------
  api_ingesta:
    build: .
    container_name: ecosystems_api_ingesta
    command: uvicorn api.api_ingesta:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/

  api_historicos:
    build: .
    container_name: ecosystems_api_historicos
    command: uvicorn api.api_historicos:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    depends_on:
      - db
    environment:
      - DB_HOST=db

  api_perfiles:
    build: .
    container_name: ecosystems_api_perfiles
    command: uvicorn api.api_perfiles:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    depends_on:
      - db
    environment:
      - DB_HOST=db

  worker_historicos:
    build: .
    container_name: ecosystems_worker
    command: python workers/worker_historicos.py
    depends_on:
      - rabbitmq
      - db
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/
      - DB_HOST=db

  adaptador_mqtt:
    build: .
    container_name: ecosystems_adaptador_mqtt
    command: python adaptadores/adaptador_mqtt.py
    depends_on:
      - rabbitmq
      - mosquitto
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/
      - MQTT_BROKER=mosquitto

volumes:
  pgdata: