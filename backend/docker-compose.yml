version: '3.8'

services:
  # --------------------------------------------------------
  # 1. INFRAESTRUCTURA BASE (Broker, BD y MQTT)
  # --------------------------------------------------------
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: ecosystems_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tu_password
      POSTGRES_DB: ecosystems_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecosystems_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ecosystems_mqtt
    ports:
      - "1883:1883"
    command: sh -c "echo 'listener 1883' > /mosquitto/config/mosquitto.conf && echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && mosquitto -c /mosquitto/config/mosquitto.conf"

  # --------------------------------------------------------
  # 2. MICROSERVICIOS NODE.JS (APIs y Workers)
  # --------------------------------------------------------
  api_ingesta:
    build: ./node-api
    container_name: ecosystems_api_ingesta
    command: npm run start:ingesta
    ports:
      - "8000:8000"
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/

  api_historicos:
    build: ./node-api
    container_name: ecosystems_api_historicos
    command: npm run start:historicos
    ports:
      - "8002:8002"
    depends_on:
      - db
    environment:
      - DB_HOST=db

  api_perfiles:
    build: ./node-api
    container_name: ecosystems_api_perfiles
    command: npm run start:perfiles
    ports:
      - "8003:8003"
    depends_on:
      - db
    environment:
      - DB_HOST=db

  controlador_valvulas:
    build: ./node-api
    container_name: ecosystems_controlador_valvulas
    command: npm run start:valvulas
    ports:
      - "8001:8001"
    depends_on:
      - rabbitmq
      - db
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/
      - DB_HOST=db

  worker_historicos:
    build: ./node-api
    container_name: ecosystems_worker
    command: npm run start:worker
    depends_on:
      - rabbitmq
      - db
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/
      - DB_HOST=db

  adaptador_mqtt:
    build: ./node-api
    container_name: ecosystems_adaptador_mqtt
    command: npm run start:mqtt_adapter
    depends_on:
      - rabbitmq
      - mosquitto
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/
      - MQTT_BROKER=mqtt://mosquitto

  adaptador_lorawan:
    build: ./node-api
    container_name: ecosystems_adaptador_lorawan
    command: npm run start:lorawan_adapter
    ports:
      - "8004:8004"
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq/
      - PORT=8004

  swagger_docs:
    build: ./node-api
    container_name: ecosystems_swagger_docs
    command: npm run start:swagger
    ports:
      - "3000:3000"
    environment:
      - PORT=3000

volumes:
  pgdata:
